{% extends "base.html" %}

{% block title %}تسجيل الدخول — نظام صيانة صوامع العالية{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <div class="form-box">
        <div class="sub-title" style="font-size:20px; text-align:center; justify-content:center; margin-bottom:20px;">
            🔐 تسجيل الدخول
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" name="username" required placeholder="أدخل اسمك" autofocus>
            </div>
            
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" required placeholder="أدخل كلمة المرور">
            </div>
            
            <button type="submit" class="btn btn-gold" style="width:100%; padding:12px; font-size:16px;">
                دخول النظام
            </button>
        </form>
        
        <div style="text-align:center; margin-top:15px; font-size:12px; color:#6b7c93;">
            (كلمة المرور الافتراضية: <strong>admin</strong>)
        </div>
    </div>
</div>
{% endblock %}
